version: '3.8'

services:
  tollwise-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: tollwise-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
